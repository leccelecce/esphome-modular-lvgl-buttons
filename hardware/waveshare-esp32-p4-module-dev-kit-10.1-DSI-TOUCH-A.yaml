# Special LVGL settings required for this display.
# The panel driver does no hardware transform, so rotation is done in LVGL
# (on the ESP32-P4 this is PPA-accelerated, so it is effectively free).
#
# NOTE: native scan order is portrait 800x1280. Pass rotation: "270" from the
# device config for the usual 1280x800 landscape mounting — confirmed upright on
# real hardware. Use "90" if your panel is mounted the other way up.
lvgl:
  rotation: ${rotation | default("0")}

# -------------------------------------------
# Audio devices
# -------------------------------------------
# ES8311 codec on the shared I2C bus, driving the NS4150B amp on the MX1.25
# speaker header, plus the onboard microphone. There is no ES7210 on this board
# — the microphone is the codec's own analog input.
i2s_audio:
  - id: audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    address: 0x18

microphone:
  - platform: i2s_audio
    id: my_microphone
    i2s_audio_id: audio_bus
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: my_speaker
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO9
    audio_dac: es8311_dac
    dac_type: external
    channel: mono
    buffer_duration: 100ms
    bits_per_sample: 16bit
    sample_rate: 48000

  - platform: mixer
    id: mixing_speaker
    output_speaker: my_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

switch:
  - platform: gpio
    id: audio_amplifier
    name: Speaker Enable
    icon: "mdi:speaker"
    entity_category: config
    pin: GPIO53  # BSP_POWER_AMP_IO, active high
    restore_mode: RESTORE_DEFAULT_ON
