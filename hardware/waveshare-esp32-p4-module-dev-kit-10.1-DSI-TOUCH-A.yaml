# Waveshare ESP32-P4-Module-DEV-KIT carrier board + Waveshare 10.1-DSI-TOUCH-A panel.
#
# This is the *two-piece* combination: the Raspberry-Pi-form-factor
# ESP32-P4-Module-DEV-KIT (ESP32-P4-Module SoM — ESP32-P4NRW32 + ESP32-C6 +
# 16MB flash) with a 10.1inch 800x1280 IPS DSI panel plugged into the MIPI-DSI
# FPC (J3). It is NOT the all-in-one ESP32-P4-WIFI6-Touch-LCD-10.1 — see
# hardware/waveshare-esp32-p4-wifi6-touch-lcd-10.1.yaml for that one.
#
# The DEV-KIT carrier wiring is the same as the ESP32-P4-WIFI6-DEV-KIT (same
# vendor BSP, esp32_p4_platform): I2C on 7/8, ES8311 on 13/12/11/10/9, PA on
# GPIO53, C6 over SDIO slot 1, IP101GRI Ethernet PHY. The only board difference
# is flash: the Module ships 16MB (some batches 32MB) where the WIFI6 DEV-KIT
# is 32MB.
#
# Board-level notes (all panels on this board):
#   - No LCD reset GPIO      (BSP_LCD_RST      = GPIO_NUM_NC) — panel self-resets
#     NOTE: because there is no reset pin, ESPHome's mipi_dsi issues a DCS software
#     reset and then sends the init sequence with no settling time. The JD9365 needs
#     120ms after reset, so the sequence is ignored, the DSI command FIFO never
#     drains, and the boot dies in the task watchdog — blank screen + safe mode.
#     Intermittent, since it is a race. Fix: patches/esphome-2026.9.1-mipi-dsi-swreset-120ms.patch
#   - No backlight PWM GPIO  (BSP_LCD_BACKLIGHT = GPIO_NUM_NC) — brightness is written
#     over I2C to the panel's backlight controller: device 0x45, register 0x96, 0x00-0xFF
#   - No touch INT / RST GPIO (both GPIO_NUM_NC) — GT9271 is polled on the shared I2C bus
#   - No ES7210 mic ADC — the DEV-KIT uses the ES8311's analog mic input only
#   - GPIO45 drives the onboard power/activity LED (active LOW). Left unclaimed here.
#   - Reserved, do not reuse: GPIO7/8 (I2C0), GPIO9-13 + 53 (audio),
#     GPIO39-44 (TF card), GPIO29-35 + 50-52 (Ethernet RMII), GPIO0-3 (boot straps)
#
# Board wiki:  https://www.waveshare.com/wiki/ESP32-P4-Module-DEV-KIT
# Panel wiki:  https://www.waveshare.com/wiki/10.1-DSI-TOUCH-A
# Vendor BSP:  https://github.com/waveshareteam/Waveshare-ESP32-components
#              bsp/esp32_p4_platform/esp32_p4_platform.c  (bsp_display_brightness_set)
---

substitutions:
  # Screen Size (native portrait 800x1280)
  # Swapped automatically for 90/270 rotation
  screen_height: ${1280 if rotation | default("0") not in ["90", "270"] else 800}
  screen_width: ${800 if rotation | default("0") not in ["90", "270"] else 1280}

esphome:
  min_version: 2026.7.0
  project:
    name: "Waveshare.ESP32-P4-Module-DEV-KIT-10-1-DSI-TOUCH-A"
    version: "1.0"

esp32:
  # Engineering-sample profile, which boots on both ES and production (rev3)
  # silicon. If your boot log says `chip revision: v3.x` you can switch to
  # `board: esp32-p4_r3-evboard` and raise cpu_frequency to 400MHz — but a
  # rev3-only image will NOT boot on an engineering sample, so this stays the
  # conservative default.
  board: esp32-p4-evboard
  variant: esp32p4
  # ESP32-P4NRW32 on the ESP32-P4-Module: 16MB NOR flash + 32MB in-package PSRAM.
  # Some batches ship a 32MB-flash module — bump this if you have one.
  flash_size: 16MB
  cpu_frequency: 360MHz
  # The 10.1 panel's JD9365 init sequence is long and runs at 1.5Gbps. The
  # default 5s task watchdog kills display setup mid-init, so give it room.
  watchdog_timeout: 30s
  framework:
    type: esp-idf
    advanced:
      execute_from_psram: true
      enable_idf_experimental_features: true

psram:
  mode: hex
  speed: 200MHz

preferences:
  flash_write_interval: 5min

# Powers the MIPI DSI PHY — the panel stays dark without this.
esp_ldo:
  - voltage: 2.5V
    channel: 3

http_request:  # Needed by esp32_hosted-update and any JSON stuff

# -------------------------------------------
# Network hardware
# -------------------------------------------
# The ESP32-P4 has no radio of its own; the ESP32-C6 on the module provides
# Wi-Fi 6 over SDIO. If the C6 never comes up on your unit, try active_high: false.
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

# The board also has a 100M IP101GRI Ethernet PHY (RMII) on RJ45, with a PoE
# header. Not enabled here because common/wifi.yaml is the usual transport.
# Pins if you want it:
#   type: IP101, mdc_pin: GPIO31, mdio_pin: GPIO52, power_pin: GPIO51,
#   clk: {pin: GPIO50, mode: CLK_EXT_IN}

# Firmware update for esp32_hosted ESP32-C6
update:
  - platform: esp32_hosted
    name: ESP-Hosted Firmware
    icon: mdi:chip
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: 6h

# -------------------------------------------
# Shared I2C bus
# -------------------------------------------
# One bus serves everything: ES8311 codec (0x18), the panel's GT9271 touch
# controller (0x5D), the panel's backlight controller (0x45), plus whatever is
# wired to the I2C header (J10) / 40-pin header. Onboard parts top out at 400kHz.
i2c:
  - id: bus_a
    sda: GPIO07
    scl: GPIO08
    frequency: 400kHz
    scan: true

# -------------------------------------------
# Touchscreen GT9271 (GT911-compatible) over I2C
# -------------------------------------------
# No interrupt or reset pin is routed on the DSI FPC, so the driver polls.
# If the boot scan reports 0x14 instead of 0x5D, add `address: 0x14` here.
touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: bus_a
    display: main_display
    update_interval: 50ms
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    # on_touch:
    #   - lambda: |-
    #       ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%d",
    #                touch.x, touch.y, touch.x_raw, touch.y_raw);

# -------------------------------------------
# Backlight (I2C, not PWM)
# -------------------------------------------
# The 10.1-DSI-TOUCH-A carries its own backlight controller. Brightness is a
# single byte written to register 0x96 of I2C device 0x45 — same as the vendor
# BSP's bsp_display_brightness_set(). (The panel wiki quotes register 0x86; the
# BSP uses 0x96, which is what is confirmed working on this panel.) A template
# output lets the normal monochromatic light (and common/backlight_time.yaml)
# drive it unchanged.
output:
  - platform: template
    id: gpio_backlight_pwm
    type: float
    zero_means_zero: true
    write_action:
      - lambda: |-
          uint8_t level = (uint8_t) lroundf(state * 255.0f);
          uint8_t data[2] = {0x96, level};
          id(bus_a).write(0x45, data, sizeof(data));

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# -------------------------------------------
# Display — MIPI DSI, 2 lanes @ 1.5Gbps, JD9365
# -------------------------------------------
display:
  # NOTE: model is CUSTOM, not WAVESHARE-10.1-DSI-TOUCH-A, purely so the init
  # sequence can start with a 120ms delay. This board routes no LCD reset pin, so
  # ESPHome's mipi_dsi issues a DCS software reset and then sends the panel init
  # sequence with no settling time; the JD9365 ignores commands for 120ms after
  # reset, the DSI command FIFO never drains, and the boot dies in the task
  # watchdog (blank screen + safe mode). A YAML `init_sequence:` on a named model
  # is APPENDED after the model's own, which is far too late to help -- hence
  # CUSTOM, where init_sequence IS the whole sequence and the delay lands first.
  # The vendor driver does the same thing (panel_jd9365_reset waits 120ms).
  #
  # Options below reproduce the named model exactly; all other settings inherit
  # identical schema defaults. SLPOUT/DISPON/PIXFMT/MADCTL are still appended
  # automatically by ESPHome, as with any model.
  #
  # TRADE-OFF: this pins a copy of the init sequence here, so it will not pick up
  # upstream changes to the WAVESHARE-10.1-DSI-TOUCH-A model. Prefer reverting to
  # `model: WAVESHARE-10.1-DSI-TOUCH-A` once ESPHome waits 120ms after reset
  # itself -- see patches/esphome-2026.9.1-mipi-dsi-swreset-120ms.patch.
  - platform: mipi_dsi
    id: main_display
    model: CUSTOM
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 1280
    color_order: RGB
    pclk_frequency: 80MHz
    lane_bit_rate: 1.5Gbps
    hsync_pulse_width: 20
    hsync_back_porch: 20
    hsync_front_porch: 40
    vsync_pulse_width: 4
    vsync_back_porch: 10   # vendor JD9365_800_1280_PANEL_60HZ (ESPHome model says 12)
    vsync_front_porch: 30
    init_sequence:
      # ---- THE FIX: settle 120ms after the DCS software reset ----
      - delay 120ms
